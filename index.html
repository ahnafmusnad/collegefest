<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020a0b" />
    <title>Carnaval Da Chittagong College | Winter is Coming | CDCC Fest</title>
    <meta name="description" content="Carnaval Da Chittagong College - The grand winter fest uniting the Four Great Houses of Chittagong College in an epic saga of competitions, music, intellect, and glory." />
    <!-- PERF FIX: fonts.
         Two changes. (1) Trimmed 24 weights down to 15 by dropping the ones
         never applied anywhere in the codebase: Cinzel 500 + 900, Jakarta 300 +
         800, Garamond 600. Fewer files to fetch.
         (2) media="print" + the onload swap makes this stylesheet
         NON-RENDER-BLOCKING. A plain rel="stylesheet" font link forces the
         browser to paint NOTHING until it has fetched the CSS and started
         pulling font files - blank screen the whole time. Now the page paints
         immediately with the fallback stack and the real fonts swap in
         (display=swap was already set). <noscript> keeps fonts working if
         JS is disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=MedievalSharp&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=MedievalSharp&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
