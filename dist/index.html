    <!-- PERF FIX: fonts.
         Two changes. (1) Trimmed 24 weights down to 15 by dropping the ones
         never applied anywhere in the codebase: Cinzel 500 + 900, Jakarta 300 +
         800, Garamond 600. Fewer files to fetch.
         (2) media="print" + the onload swap makes this stylesheet
         NON-RENDER-BLOCKING. A plain rel="stylesheet" font link forces the
         browser to paint NOTHING until it has fetched the CSS and started
         pulling font files - blank screen the whole time. Now the page paints
         immediately with the fallback stack and the real fonts swap in
         (display=swap was already set). <noscript> keeps fonts working if
         JS is disabled. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
